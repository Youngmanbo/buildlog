<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>동별 배치표</title>
  <style>
    :root{
      --border:#1f2e54;       /* 남색 테두리 느낌 */
      --grid:#273a6a;
      --header:#cfd7ea;       /* 상단 호수 헤더 */
      --floor:#e9edf6;        /* 층 라벨 */
      --text:#1a1a1a;
      --muted:#caa274;        /* 연한 갈색 글자(세대 타입) */
      --green:#5a8f56;        /* 초록 영역 */
      --greenText:#e9f3e8;
      --basement:#616161;     /* 지하1 회색 */
    }

    body{font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, sans-serif; margin:24px; color:var(--text);}
    .wrap{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start}

    .tower{
      border:2px solid var(--border);
      border-radius:6px;
      overflow:hidden;
      width: 300px; /* 필요시 동마다 다르게 줄 수 있음 */
      background:#fff;
    }
    .tower .title{
      text-align:center;
      font-weight:800;
      letter-spacing:1px;
      padding:8px 0;
      border-bottom:2px solid var(--border);
      background:#f7f8fb;
    }

    table.grid{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
      font-size:13px;
    }
    table.grid th, table.grid td{
      border:1px solid var(--grid);
      text-align:center;
      padding:6px 2px;
      position:relative;
      height:28px;
      overflow:hidden;
      white-space:nowrap;
    }
    /* 호수 헤더 */
    table.grid thead th{
      background:var(--header);
      font-weight:700;
    }
    /* 좌측 층 라벨 */
    table.grid .floor{
      background:var(--floor);
      font-weight:800;
      width:52px;
    }

    /* 일반 칸의 글자 톤(사진처럼 약간 연하게) */
    .unit{
      color:var(--muted);
      font-weight:700;
      letter-spacing:.3px;
    }

    /* X 표시 칸 */
    .blocked::before,
    .blocked::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(45deg, transparent 47%, var(--grid) 48%, var(--grid) 52%, transparent 53%),
        linear-gradient(-45deg, transparent 47%, var(--grid) 48%, var(--grid) 52%, transparent 53%);
      opacity:.9;
      pointer-events:none;
    }

    /* 초록 영역 */
    .green{
      background:var(--green);
      color:var(--greenText);
      font-weight:800;
    }

    /* 지하1 라인(회색 바 느낌) */
    .basement{
      background:var(--basement);
      color:#fff;
      font-weight:800;
    }

    /* 동마다 폭 조절이 필요하면 클래스 추가 */
    .w-narrow{width:260px;}
    .w-wide{width:360px;}

    /* 클릭/하이라이트(원하면) */
    td[data-cell]{cursor:pointer;}
    td[data-cell].active{outline:3px solid #ff4d4f; outline-offset:-3px;}
  </style>
</head>
<body>

<div class="wrap" id="app"></div>

  const styleExtra = document.createElement("style");
  styleExtra.textContent = `.unit-blue{ color:#274a9a; font-weight:800; }`;
  document.head.appendChild(styleExtra);

  const app = document.getElementById("app");

  function cellClass(c){
    const cls = [];
    if (c?.blocked) cls.push("blocked");
    if (c?.green) cls.push("green");
    if (c?.basement) cls.push("basement");
    if (c?.text && !c.green && !c.basement) cls.push("unit");
    if (c?.cls) cls.push(c.cls);
    return cls.join(" ");
  }

  function renderTower(tower){
    const root = document.createElement("div");
    root.className = `tower ${tower.widthClass||""}`.trim();

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = tower.name;
    root.appendChild(title);

    const table = document.createElement("table");
    table.className = "grid";

    // THEAD
    const thead = document.createElement("thead");
    const trh = document.createElement("tr");
    const th0 = document.createElement("th");
    th0.textContent = ""; // 좌상단
    trh.appendChild(th0);
    tower.cols.forEach(c=>{
      const th = document.createElement("th");
      th.textContent = c;
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);

    // TBODY
    const tbody = document.createElement("tbody");
    tower.floors.forEach((floor, rIdx)=>{
      const tr = document.createElement("tr");
      const tdFloor = document.createElement("td");
      tdFloor.className = "floor";
      tdFloor.textContent = floor;
      tr.appendChild(tdFloor);

      let col = 0;
      while (col < tower.cols.length){
        const c = (tower.cells[rIdx] && tower.cells[rIdx][col]) ? tower.cells[rIdx][col] : {};
        const td = document.createElement("td");
        td.dataset.cell = `${tower.name}-${floor}-${tower.cols[col]}`;

        const span = c.colspan ? Number(c.colspan) : 1;
        if (span > 1) td.colSpan = span;

        td.className = cellClass(c);
        td.textContent = c.text || "";

        // 클릭 하이라이트(원하면 사용)
        td.addEventListener("click", ()=>{
          document.querySelectorAll("td.active").forEach(x=>x.classList.remove("active"));
          td.classList.add("active");
        });

        tr.appendChild(td);
        col += span;
      }

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    root.appendChild(table);
    return root;
  }

  TOWERS.forEach(t=> app.appendChild(renderTower(t)));
</script>

</body>
</html>
